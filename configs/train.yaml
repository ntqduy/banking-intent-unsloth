model_name: unsloth/Qwen2.5-7B

train_csv: sample_data/clean_data/train.csv
val_csv: sample_data/clean_data/val.csv
test_csv: sample_data/clean_data/test.csv

label2id_path: result/result_train/analysis_data/label2id.json
id2label_path: result/result_train/analysis_data/id2label.json

output_dir: result/result_train/checkpoints
final_model_dir: result/final_weight/final_lora_adapter
report_dir: result/result_train

max_seq_length: 512
max_new_tokens: 12
batch_size: 2
eval_batch_size: 4
gradient_accumulation_steps: 8
learning_rate: 2.0e-4
optimizer: adamw_8bit
lr_scheduler_type: linear
num_train_epochs: 3
max_steps: -1
weight_decay: 0.01
warmup_steps: 169
logging_steps: 10
save_strategy: epoch
save_total_limit: 2
seed: 42

load_in_4bit: true
dtype: none
fp16: auto
bf16: auto
packing: false

lora_r: 16
lora_alpha: 16
lora_dropout: 0.0
lora_bias: none
use_gradient_checkpointing: true
use_rslora: false
target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj

regularization_techniques:
  - weight_decay
  - lora_dropout_0
augmentation_techniques:
  - none

device: 0
